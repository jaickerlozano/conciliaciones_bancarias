[project]
name = "conciliaciones-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "datos_reales: tests que usan los archivos reales del cliente (se omiten si no están disponibles)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
